set -g prefix C-Space
unbind C-b
bind C-Space send-prefix
bind r source-file ~/.tmux.conf \; display "Reloaded!"
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Scrollback search:
# - prefix + f: search forward (typically "up" / older scrollback)
# - prefix + F: search backward (typically "down" / newer scrollback)
bind-key f copy-mode \; send-keys -X search-forward
bind-key F copy-mode \; send-keys -X search-backward
# split window
unbind '"'
# vertical split (prefix -)
bind v splitw -v -c "#{pane_current_path}"
unbind %
bind h splitw -h -c "#{pane_current_path}" # horizontal split (prefix |)
# new window
bind c new-window -c "#{pane_current_path}"
set -g default-command "/bin/zsh"

# Zellij-style no-prefix navigation and pane management
bind -n M-h if-shell -F '#{pane_at_left}' 'previous-window' 'select-pane -L'
bind -n M-l if-shell -F '#{pane_at_right}' 'next-window' 'select-pane -R'
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-u run-shell '~/.local/bin/popuptmux'
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U

bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3

bind -n M-- split-window -v -c "#{pane_current_path}"
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M-n command-prompt -I "#W" "rename-window '%%'"
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w kill-pane
bind -n M-z resize-pane -Z

# Alt+m: merge all windows into current window, then cycle layouts
# Alt+M: reverse — break all panes back into separate windows
# Alt+b: same as Alt+M (legacy alias)
bind -n M-m run-shell 'cur=$(tmux display-message -p "##{window_index}"); others=$(tmux list-windows -F "##{window_index}" | grep -v "^${cur}$"); if [ -n "$others" ]; then for w in $others; do tmux join-pane -s ":$w" -t ":$cur"; done; tmux select-layout even-vertical; else tmux next-layout; fi'
bind -n M-M run-shell 'while [ $(tmux list-panes | wc -l) -gt 1 ]; do tmux break-pane -d; done'
bind -n M-b break-pane -d
# Alt+;: cycle layouts of the current window only (no window merging)
bind -n M-\; next-layout

bind -n M-1 select-window -t:=1
bind -n M-2 select-window -t:=2
bind -n M-3 select-window -t:=3
bind -n M-4 select-window -t:=4
bind -n M-5 select-window -t:=5
bind -n M-6 select-window -t:=6
bind -n M-7 select-window -t:=7
bind -n M-8 select-window -t:=8
bind -n M-9 select-window -t:=9

# Make mouse useful in copy mode
set-option -g mouse on
setw -g alternate-screen on
set-window-option -g aggressive-resize on


# ─────────────────────────────────────────────────
# Clipboard (pbcopy for macOS + OSC 52 fallback)
# ─────────────────────────────────────────────────
set -g mode-keys vi
set -s set-clipboard on
# Reset list-style options on reload so `source-file ~/.tmux.conf` stays idempotent.
set -gu terminal-features
set -gu terminal-overrides
set -as terminal-features ',ghostty:clipboard'
set -as terminal-features ',tmux*:clipboard'
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ─────────────────────────────────────────────────
# TPM Plugins
# ─────────────────────────────────────────────────
# Clear legacy style bakes from any previously loaded theme so the
# Catppuccin Latte palette block below (new-style `status-style`) wins over
# any legacy `status-bg/fg`. Without this, `prefix + r` keeps stale colors.
set -gu status-bg
set -gu status-fg
set -gu window-status-style

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# URL picker - prefix + u to open URLs in browser
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-bind 'u'

# Persist and auto-restore sessions across reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# OpenSessions sidebar — disabled (1.3GB RAM + 49% CPU from 17 bun processes)
# set -g @plugin 'Ataraxy-Labs/opensessions'

# ─────────────────────────────────────────────────
# Custom fzf window switcher (prefix + w)
# ─────────────────────────────────────────────────
bind w display-popup -E -w 80% -h 80% "\
  tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | \
  fzf --reverse --header='Switch Window' \
      --preview 'tmux capture-pane -ep -t {1}' \
      --preview-window=right:60% | \
  awk '{print \$1}' | \
  xargs -I {} tmux switch-client -t {}"

# ─────────────────────────────────────────────────
# Floating scratch terminal (Alt+j / prefix+j)
# ─────────────────────────────────────────────────
bind j run-shell '~/.local/bin/popuptmux'
bind J run-shell 'POPUP_TMUX_SESSION=__popup_opencode__ POPUP_TMUX_COMMAND="opencode" ~/.local/bin/popuptmux'

# ─────────────────────────────────────────────────
# Status Line — base layout (palette set after TPM init, below)
# ─────────────────────────────────────────────────
set -g status-position top
set -g status-justify left
set -gu window-style
set -gu window-active-style

# Initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'

# ─────────────────────────────────────────────────
# Lucario palette — dark, matches the custom Ghostty Lucario theme
# (~/.config/ghostty/themes/Lucario). Set AFTER TPM init so it wins over any
# plugin styles. Hex (#rrggbb), pinned regardless of Ghostty's palette.
#   pane-bg #2b3e50  bar-bg #34495e  fg #f8f8f2  muted #8d9cad
#   teal #8be0fd(p6)  yellow #f0cc04(p3)  blue #5c98cd(p4)  green #72cc5a(p10)
# ─────────────────────────────────────────────────
# Bar bg = #34495e, one shade LIGHTER than Lucario's pane bg #2b3e50 — the
# dark-theme convention for a raised status strip.
set -g status-style 'bg=#34495e,fg=#f8f8f2'
set -g pane-border-style 'bg=default,fg=#45596f'
set -g pane-active-border-style 'bg=default,fg=#f0cc04'
set -g display-panes-colour '#8d9cad'
set -g display-panes-active-colour '#f0cc04'
setw -g clock-mode-colour '#8be0fd'
set -g message-style 'bg=#5c98cd,fg=#19242f'
set -g message-command-style 'bg=#5c98cd,fg=#19242f'

# Row 0 segments — reused by wrap-tabs.sh. Session chip = teal; right side =
# date (muted) / time (cream) + host (blue accent pill).
set -g status-left '#[fg=#19242f,bg=#8be0fd,bold] #S #[default] '
set -g status-right '#[fg=#8d9cad] %Y-%m-%d #[fg=#f8f8f2] %H:%M #[fg=#19242f,bg=#5c98cd,bold] #H #[default]'
set -g status-right-length 60

# #{W:...} joins window entries with this; Nord set it to "" so it does not
# stack a default space on top of wrap-tabs.sh's own " │ " divider. Keep empty.
set -g window-status-separator ''

# prefix + N — manual prompt rename: sets window name AND current pane title to the same value.
# prefix + R is left to the autoname watcher (scripts/agent-rename.sh — LLM-generated auto-rename from Claude/Codex context).
bind N command-prompt -I "#W" "rename-window '%%' \; select-pane -T '%%'"

# ─────────────────────────────────────────────────
# Multi-row window tabs (scripts/wrap-tabs.sh)
#   row 0      session name (left) + clock / host (right)
#   rows 1..K  window tabs, packed by measured width; overflow wraps down
#   last row   pane list of the current window
# tmux caps `status` at 5 lines, so K <= 3 (session row + pane row take two).
# The script sets `status` and status-format[*] PER SESSION (each session's
# boundaries come from its own windows at its own client width — the hook's
# trigger context is irrelevant), plus a single-row global fallback for the
# instant before a new session's first hook lands. It reruns on the hooks
# below (and from the autoname plugin, via window-renamed).
# ─────────────────────────────────────────────────

# Session name now owns the full width of row 0, so let it show in full
# (tmux-power/earlier config clamped it to 10, truncating "ami-workspace").
set -g status-left-length 30

# Pane list for the last row. Each entry = "<index>:<pane_title>"; if pane_title
# is still the default (== hostname) fall back to the running command. Rename a
# pane via prefix + R to replace the command fallback with a stable label.
set -g @wrap_tabs_pane_format '#[align=left] #{P: #{pane_index}:#{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}} ,#[reverse] #{pane_index}:#{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}} #[noreverse] }'

# Flat tab style (overrides tmux-power's powerline arrows). wrap-tabs.sh inserts
# a thin " │ " divider between tabs. Inactive = muted text; current window = a
# flat yellow background pill (dark bold text), no arrows. When a window's agent
# is working (@cc_working set by the Claude hooks, animated by tab-spinner.sh),
# a green braille spinner (@cc_spin) is shown before the tab.
set -g window-status-format         '#[fg=#8d9cad,nobold]#{?#{@cc_working},#[fg=#72cc5a]#{@cc_spin} #[fg=#8d9cad]#[nobold],}#I:#W#F'
set -g window-status-current-format '#[fg=#19242f,bg=#f0cc04,bold] #{?#{@cc_working},#{@cc_spin} ,}#I:#W#F #[default]'

# Repack on anything that changes tab count / names / available width.
# client-attached/-detached matter because a session's row budget follows its
# widest attached client — attach/detach changes that width source.
set-hook -g 'window-linked[7]'          'run-shell -b "$HOME/Github/lazybuild/tmux/scripts/wrap-tabs.sh"'
set-hook -g 'window-unlinked[7]'        'run-shell -b "$HOME/Github/lazybuild/tmux/scripts/wrap-tabs.sh"'
set-hook -g 'window-renamed[7]'         'run-shell -b "$HOME/Github/lazybuild/tmux/scripts/wrap-tabs.sh"'
set-hook -g 'client-resized[7]'         'run-shell -b "$HOME/Github/lazybuild/tmux/scripts/wrap-tabs.sh"'
set-hook -g 'client-session-changed[7]' 'run-shell -b "$HOME/Github/lazybuild/tmux/scripts/wrap-tabs.sh"'
set-hook -g 'client-attached[7]'        'run-shell -b "$HOME/Github/lazybuild/tmux/scripts/wrap-tabs.sh"'
set-hook -g 'client-detached[7]'        'run-shell -b "$HOME/Github/lazybuild/tmux/scripts/wrap-tabs.sh"'

# Build the layout once at load.
run-shell -b "$HOME/Github/lazybuild/tmux/scripts/wrap-tabs.sh"

# Spinner animator for "agent working" tabs (@cc_working set by Claude hooks).
run-shell -b "$HOME/Github/lazybuild/tmux/scripts/tab-spinner.sh"

# Auto-rename windows to current directory basename (after TPM to avoid plugin overrides)
setw -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# AI window auto-rename (Claude/Codex session → short LLM title, tagged with
# its Linear issue id when it has one). Vendored from
# Luodian/tmux-autoname-agent-sessions — logic lives in scripts/agent-rename.sh,
# hooks/keybinding/watcher wired up by scripts/autoname-setup.sh.
# (set -g @autoname_enable 'on' — default)
run-shell -b "bash $HOME/Github/lazybuild/tmux/scripts/autoname-setup.sh"
set -g @autoname_model 'openai/gpt-oss-120b'

# Enable image display in tmux (for Kitty + image.nvim)
set -g allow-passthrough on
set -g visual-activity off
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Enable hyperlinks support for URL clicking (Cmd+click in Ghostty)
set -ga terminal-features 'xterm*:hyperlinks'
set -ga terminal-features 'ghostty:hyperlinks'
set -as terminal-overrides ',ghostty:Tc:hyperlinks'
set -as terminal-overrides ',xterm-ghostty:Tc:hyperlinks'
