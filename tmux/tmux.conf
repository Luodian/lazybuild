set -g prefix C-Space
unbind C-b
bind C-Space send-prefix
bind r source-file ~/.tmux.conf \; display "Reloaded!"
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Scrollback search:
# - prefix + f: search forward (typically "up" / older scrollback)
# - prefix + F: search backward (typically "down" / newer scrollback)
bind-key f copy-mode \; send-keys -X search-forward
bind-key F copy-mode \; send-keys -X search-backward
# split window
unbind '"'
# vertical split (prefix -)
bind v splitw -v -c "#{pane_current_path}"
unbind %
bind h splitw -h -c "#{pane_current_path}" # horizontal split (prefix |)
# new window
bind c new-window -c "#{pane_current_path}"
set -g default-command "/bin/zsh"

# Zellij-style no-prefix navigation and pane management
bind -n M-h if-shell -F '#{pane_at_left}' 'previous-window' 'select-pane -L'
bind -n M-l if-shell -F '#{pane_at_right}' 'next-window' 'select-pane -R'
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-u run-shell '~/.local/bin/popuptmux'
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U

bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3

bind -n M-- split-window -v -c "#{pane_current_path}"
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M-n command-prompt -I "#W" "rename-window '%%'"
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w kill-pane
bind -n M-z resize-pane -Z

# Alt+m: merge all windows into current window, then cycle layouts
# Alt+M: reverse — break all panes back into separate windows
# Alt+b: same as Alt+M (legacy alias)
bind -n M-m run-shell 'cur=$(tmux display-message -p "##{window_index}"); others=$(tmux list-windows -F "##{window_index}" | grep -v "^${cur}$"); if [ -n "$others" ]; then for w in $others; do tmux join-pane -s ":$w" -t ":$cur"; done; tmux select-layout even-vertical; else tmux next-layout; fi'
bind -n M-M run-shell 'while [ $(tmux list-panes | wc -l) -gt 1 ]; do tmux break-pane -d; done'
bind -n M-b break-pane -d
# Alt+;: cycle layouts of the current window only (no window merging)
bind -n M-\; next-layout

bind -n M-1 select-window -t:=1
bind -n M-2 select-window -t:=2
bind -n M-3 select-window -t:=3
bind -n M-4 select-window -t:=4
bind -n M-5 select-window -t:=5
bind -n M-6 select-window -t:=6
bind -n M-7 select-window -t:=7
bind -n M-8 select-window -t:=8
bind -n M-9 select-window -t:=9

# Make mouse useful in copy mode
set-option -g mouse on
setw -g alternate-screen on
set-window-option -g aggressive-resize on


# ─────────────────────────────────────────────────
# Clipboard (pbcopy for macOS + OSC 52 fallback)
# ─────────────────────────────────────────────────
set -g mode-keys vi
set -s set-clipboard on
# Reset list-style options on reload so `source-file ~/.tmux.conf` stays idempotent.
set -gu terminal-features
set -gu terminal-overrides
set -as terminal-features ',ghostty:clipboard'
set -as terminal-features ',tmux*:clipboard'
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ─────────────────────────────────────────────────
# TPM Plugins
# ─────────────────────────────────────────────────
# Clear legacy style bakes from any previously loaded theme so Nord's
# `status-style` (new-style) wins over tmux-power's `status-bg/fg` (legacy).
# Without this, reloading via `prefix + r` keeps stale colors in memory.
set -gu status-bg
set -gu status-fg
set -gu window-status-style

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nordtheme/tmux'

# URL picker - prefix + u to open URLs in browser
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-bind 'u'

# Persist and auto-restore sessions across reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# OpenSessions sidebar — disabled (1.3GB RAM + 49% CPU from 17 bun processes)
# set -g @plugin 'Ataraxy-Labs/opensessions'

# AI agent session management (auto-rename, picker, history, status)
set -g @plugin 'Luodian/tmux-autoname-agent-sessions'


# ─────────────────────────────────────────────────
# Custom fzf window switcher (prefix + w)
# ─────────────────────────────────────────────────
bind w display-popup -E -w 80% -h 80% "\
  tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | \
  fzf --reverse --header='Switch Window' \
      --preview 'tmux capture-pane -ep -t {1}' \
      --preview-window=right:60% | \
  awk '{print \$1}' | \
  xargs -I {} tmux switch-client -t {}"

# ─────────────────────────────────────────────────
# Floating scratch terminal (Alt+j / prefix+j)
# ─────────────────────────────────────────────────
bind j run-shell '~/.local/bin/popuptmux'
bind J run-shell 'POPUP_TMUX_SESSION=__popup_opencode__ POPUP_TMUX_COMMAND="opencode" ~/.local/bin/popuptmux'

# ─────────────────────────────────────────────────
# Status Line — Nord theme
# ─────────────────────────────────────────────────
set -g status-position top
set -g status-justify left
set -gu window-style
set -gu window-active-style

# Initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'

# prefix + N — manual prompt rename: sets window name AND current pane title to the same value.
# prefix + R is left to tmux-autoname-agent-sessions' plugin (LLM-generated auto-rename from Claude context).
bind N command-prompt -I "#W" "rename-window '%%' \; select-pane -T '%%'"

# ─────────────────────────────────────────────────
# Two-row status: row 0 = tmux-power (session + windows), row 1 = panes of current window
# ─────────────────────────────────────────────────
set -g status 2

# Row 1 shows pane list of the current window. Each entry = "<index>:<pane_title>".
# If pane_title is still the default (equal to hostname), fall back to the running command.
# Rename a pane via prefix + R to replace the command fallback with a stable label.
set -g status-format[1] '#[align=left] #{P: #{pane_index}:#{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}} ,#[reverse] #{pane_index}:#{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}} #[noreverse] }'

# Auto-rename windows to current directory basename (after TPM to avoid plugin overrides)
setw -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# AI window rename is managed by tmux-autoname-agent-sessions plugin
# (set -g @autoname_enable 'on' — default)

# Enable image display in tmux (for Kitty + image.nvim)
set -g allow-passthrough on
set -g visual-activity off
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Enable hyperlinks support for URL clicking (Cmd+click in Ghostty)
set -ga terminal-features 'xterm*:hyperlinks'
set -ga terminal-features 'ghostty:hyperlinks'
set -as terminal-overrides ',ghostty:Tc:hyperlinks'
set -as terminal-overrides ',xterm-ghostty:Tc:hyperlinks'
